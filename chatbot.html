<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>移住相談チャットボット</title>
    <!-- Google Fonts Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        /* ＝＝＝ メインページ共通設定 ＝＝＝ */
        @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap');

        :root {
            --fugu-blue: #00B4D8;     
            --fugu-light: #CAF0F8;    
            --fugu-belly: #FFFFFF;    
            --fugu-fin: #FF9F1C;      
            --fugu-text: #03045E;     
        }

        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            color: var(--fugu-text);
            margin: 0; padding: 0;
            overflow-x: hidden;
            background-color: #E0FAFF;
        }

        /* ＝＝＝ 背景のぷくぷく泡 ＝＝＝ */
        .ocean-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, #E0FAFF 0%, #90E0EF 100%);
            z-index: -1; pointer-events: none; overflow: hidden;
        }
        .bubble {
            position: absolute; bottom: -50px; background: rgba(255, 255, 255, 0.6);
            border-radius: 50%; animation: rise infinite ease-in;
        }
        .bubble:nth-child(4), .bubble:nth-child(8) {
            background-image: url('2.png'); background-size: contain; 
            background-repeat: no-repeat; background-color: transparent; border-radius: 0; opacity: 0.6;
        }
        .bubble:nth-child(1) { width: 40px; height: 40px; left: 5%; animation-duration: 8s; }
        .bubble:nth-child(2) { width: 25px; height: 25px; left: 15%; animation-duration: 5s; animation-delay: 1s; }
        .bubble:nth-child(3) { width: 50px; height: 50px; left: 25%; animation-duration: 10s; animation-delay: 2s; }
        .bubble:nth-child(4) { width: 60px; height: 60px; left: 35%; animation-duration: 7s; animation-delay: 1.5s; }
        .bubble:nth-child(5) { width: 35px; height: 35px; left: 45%; animation-duration: 6s; animation-delay: 0.5s; }
        .bubble:nth-child(6) { width: 20px; height: 20px; left: 55%; animation-duration: 8s; animation-delay: 2.5s; }
        .bubble:nth-child(7) { width: 45px; height: 45px; left: 65%; animation-duration: 9s; animation-delay: 1s; }
        .bubble:nth-child(8) { width: 70px; height: 70px; left: 75%; animation-duration: 11s; animation-delay: 3s; }
        .bubble:nth-child(9) { width: 30px; height: 30px; left: 85%; animation-duration: 7s; animation-delay: 0.2s; }
        .bubble:nth-child(10) { width: 55px; height: 55px; left: 95%; animation-duration: 12s; animation-delay: 2s; }

        @keyframes rise {
            0% { bottom: -50px; transform: translateX(0) rotate(0deg); }
            50% { transform: translateX(20px) rotate(15deg); }
            100% { bottom: 110vh; transform: translateX(-20px) rotate(-15deg); }
        }

        /* ＝＝＝ チャット枠とヘッダー ＝＝＝ */
        #chat-container {
            max-width: 600px; margin: 20px auto; height: calc(100vh - 40px);
            background-color: var(--fugu-belly); border-radius: 30px;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 180, 216, 0.2);
            border: 5px solid rgba(255, 255, 255, 0.7);
            position: relative; z-index: 2;
        }
        
        #chat-header {
            background-color: var(--fugu-blue); color: var(--fugu-belly);
            padding: 15px 20px; display: flex; align-items: center;
            font-weight: 900; font-size: 1.2rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); z-index: 10;
        }
        #chat-header img { height: 2em; margin-right: 12px; filter: brightness(0) invert(1); } 

        #chat-area {
            padding: 25px 20px; overflow-y: auto; flex-grow: 1;
            display: flex; flex-direction: column;
            background-color: #F7FBFC;
        }

        /* ＝＝＝ 吹き出し・アイコン ＝＝＝ */
        .bot-msg-wrapper {
            display: flex; align-items: flex-start; margin-bottom: 20px;
            animation: fadeIn 0.4s ease;
        }
        .bot-icon { width: 45px; height: 45px; object-fit: contain; margin-right: 10px; }
        
        .msg {
            padding: 15px 20px; border-radius: 20px; max-width: 75%;
            line-height: 1.6; font-weight: 700; font-size: 0.95rem;
        }
        .bot-msg { background-color: var(--fugu-light); color: var(--fugu-text); border-top-left-radius: 0; }
        .user-msg {
            background-color: var(--fugu-blue); color: var(--fugu-belly);
            border-top-right-radius: 0; align-self: flex-end; margin-bottom: 20px;
            animation: fadeIn 0.4s ease; box-shadow: -2px 4px 10px rgba(0,180,216,0.1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ＝＝＝ 選択肢ボタン ＝＝＝ */
        .option-btn {
            display: flex; align-items: center; width: 100%;
            padding: 15px 20px; margin-bottom: 12px;
            background-color: var(--fugu-belly); border: 3px solid var(--fugu-blue);
            color: var(--fugu-blue); border-radius: 40px; cursor: pointer;
            font-weight: 900; font-size: 1rem; text-align: left;
            transition: all 0.3s ease; box-shadow: 0 4px 10px rgba(0, 180, 216, 0.05);
        }
        .option-btn:hover {
            background-color: var(--fugu-light); transform: scale(1.02);
            box-shadow: 0 8px 15px rgba(0, 180, 216, 0.2);
        }
    </style>
</head>
<body>

    <!-- ＝＝＝ メインサイトと同じ背景の泡 ＝＝＝ -->
    <div class="ocean-bg">
        <div class="bubble"></div><div class="bubble"></div>
        <div class="bubble"></div><div class="bubble"></div>

        // 【重要】取得済みのウェブアプリURLを下の "" の中に貼り付けてください！
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxrYF9URRIBKZaSOKvpWZI_XBBqg2giqouPR1tAnRmB3gwM6ZHD_VvhHYQY7L2omv0Q/exec";

        function sendDataToGAS(origin, history, result) {
            if (GAS_URL === "ここにコピーしたURLを貼り付けてください" || GAS_URL === "") return;
            const payload = { origin: origin, history: history, result: result };
            fetch(GAS_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify(payload)
            }).then(response => console.log("データ送信完了"))
              .catch(error => console.error("送信エラー:", error));
        }

        // ＝＝＝ 1. 補助金データベース（全19種） ＝＝＝
        const subsidyDB = {

                options: [
                    { label: "はい", next: "result_s005_s016" },
                    { label: "いいえ", next: "result_s016" }
                ]
            },
            flow_akiya_renovate: {

                options: [
                    { label: "はい", next: "flow_akiya_loan_yes" },
                    { label: "いいえ", next: "flow_akiya_loan_no" }
                ]
            },
            flow_akiya_loan_yes: {
                text: "住所は変わりますか？",
                options: [
                    { label: "はい", next: "result_s006_s005_s016" },
                    { label: "いいえ", next: "result_s006_s005" }
                ]
            },
            flow_akiya_loan_no: {
                text: "住所は変わりますか？",
                options: [
                    { label: "はい", next: "result_s006_s016" },

                ]
            },
            flow_A_start: {
                text: "現在のお住まいはどちらですか？",
                options: [
                    { label: "東京23区在住、または東京圏から23区へ通勤", next: "flow_A_23" },
                    { label: "東京圏・近畿圏・中京圏・広島県・福岡県", next: "flow_A_metro" },
                    { label: "上記以外の地域から移住予定", next: "flow_A_other" }
                ]
            },
            flow_A_23: {
                text: "移住の状況をお選びください。",
                options: [
                    { label: "下見・体験したい", next: "flow_preview" },
                    { label: "移住が決まっている", next: "flow_A_23_work" }
                ]
            },
            flow_A_23_work: {
                text: "移住後の働き方は？",
                options: [
                    { label: "テレワーク / やまぐち専門人材 / ジョブナビ就業", next: "flow_A_23_dest" },
                    { label: "やまぐち創業補助金で創業", next: "result_s001" }, 
                    { label: "就業先未定 / 上記以外で就職", next: "flow_housing" }
                ]
            },
            flow_A_23_dest: {
                text: "定住先はどちらですか？",
                options: [
                    { label: "豊田・豊浦・豊北・蓋井島・六連島", next: "result_s001_s003" },
                    { label: "上記以外", next: "result_s001" }
                ]
            },
            flow_A_metro: {
                text: "移住の状況をお選びください。",
                options: [
                    { label: "下見・体験したい", next: "flow_preview" },
                    { label: "移住が決まっている", next: "flow_A_metro_work" }
                ]
            },
            flow_A_metro_work: {
                text: "移住後の働き方は？",
                options: [
                    { label: "テレワーク / やまぐち専門人材 / ジョブナビ就業", next: "flow_A_metro_dest" },
                    { label: "やまぐち創業補助金で創業", next: "result_s002" }, 
                    { label: "就業先未定 / 上記以外で就職", next: "flow_housing" }
                ]
            },
            flow_A_metro_dest: {
                text: "定住先はどちらですか？",
                options: [
                    { label: "豊田・豊浦・豊北・蓋井島・六連島", next: "result_s002_s003" },
                    { label: "上記以外", next: "result_s002" }
                ]
            },
            flow_A_other: {
                text: "移住の状況をお選びください。",
                options: [
                    { label: "下見・体験したい", next: "flow_preview" },
                    { label: "移住が決まっている", next: "flow_housing" }
                ]
            },
            flow_B_start: {
                text: "住宅に関するご状況は？",
                options: [
                    { label: "住所が変わって住宅を取得したい", next: "flow_housing_buy" },
                    { label: "空き家バンクの物件を購入して改修したい", next: "flow_akiya_renovate" },
                    { label: "下関駅周辺の空き家を取り壊したい", next: "result_s007" },

                ]
            },

                options: [
                    { label: "店舗開業(小売・飲食・サービス)", next: "result_s009" },
                    { label: "空き家バンクの物件を住居として改修", next: "flow_akiya_renovate" },
                    { label: "空き家を取り壊したい(下関駅周辺)", next: "result_s007" }
                ]
            },
            flow_D_start: {
                text: "結婚・子育て・妊娠のどれに当てはまりますか？",
                options: [
                    { label: "最近結婚した(新婚)", next: "flow_D_married" },
                    { label: "妊娠中または出産を予定している", next: "result_s011" },
                    { label: "子どもの医療費が心配", next: "result_s012" },
                    { label: "過疎地域で第3子以降を出産した", next: "result_s004" }
                ]
            },
            flow_D_married: {
                text: "妊娠中または出産を予定していますか？",
                options: [

                ]
            },

                options: [
                    { label: "奨学金返還中・下関市内に就職・起業", next: "result_s013" },
                    { label: "農業に興味・就農体験したい(50歳未満)", next: "result_s014" },

                ]
            }

        function showBotMessage(text) {
            const wrapper = document.createElement('div');
            wrapper.className = 'bot-msg-wrapper';
            
            const icon = document.createElement('img');
            icon.src = '2.png';
            icon.className = 'bot-icon';
            
            const div = document.createElement('div');
            div.className = 'msg bot-msg';
            div.innerHTML = text;
            
            wrapper.appendChild(icon);
            wrapper.appendChild(div);
            chatArea.appendChild(wrapper);
        }

        function showUserMessage(text) {
            const div = document.createElement('div');
            div.className = 'msg user-msg';
            div.innerHTML = text;
            chatArea.appendChild(div);
        }

        function showOptions(options) {
            if (!options || options.length === 0) return;
            const container = document.createElement('div');
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span class="material-symbols-outlined" style="vertical-align: middle; font-size: 1.1rem;">chevron_right</span> ${opt.label}`;
                btn.onclick = () => {
                    container.remove();
                    showUserMessage(opt.label);

                    if (opt.label !== "最初からやり直す") {
                        chatHistory.push(opt.label);
                    }
                    
                    if (opt.label.includes("東京23区")) {
                        userOrigin = "東京23区";
                    } else if (opt.label.includes("東京圏") || opt.label.includes("近畿圏")) {
                        userOrigin = "大都市圏";
                    } else if (opt.label.includes("上記以外の地域")) {
                        userOrigin = "その他地域";
                    }

                    setTimeout(() => { playScenario(opt.next); }, 500);
                };
                container.appendChild(btn);
            });
            chatArea.appendChild(container);
            chatArea.scrollTo({ top: chatArea.scrollHeight, behavior: 'smooth' });
        }

        // ＝＝＝ 3. シナリオの再生と、結果（複数ID）の自動生成機能 ＝＝＝
        function playScenario(nodeKey) {
            if (nodeKey === "start") {
                userOrigin = "未選択";
                chatHistory = [];
            }

            if (nodeKey.startsWith("result_") && nodeKey !== "result_livehub") {
                const ids = nodeKey.replace("result_", "").split("_");
                let resultHTML = "あなたのご状況で対象となる可能性がある補助金はこちらです！<br><br>";
                let resultTitles = []; 
                
                ids.forEach(id => {
                    if(subsidyDB[id]) {
                        resultHTML += `
                            <div style="background:#fff; border:2px solid #00b4d8; padding:15px; border-radius:10px; margin-bottom:10px; text-align:left;">
                                <strong style="color:#00b4d8;">${subsidyDB[id].title}</strong><br>
                                <span style="font-size:0.9rem; color:#555;">${subsidyDB[id].desc}</span>
                            </div>`;
                        resultTitles.push(subsidyDB[id].title); 
                    }
                });

                if (ids.includes("s016") || ids.includes("s006")) {
                    resultHTML += `
                        <div style="background:#FFF3E0; border:2px dashed #FF9F1C; padding:15px; border-radius:10px; margin-bottom:10px; text-align:left;">
                            <span style="font-size:0.8rem; font-weight:bold; color:#FF9F1C;">※三世代同居・近居を予定している方はこちらも対象です！</span><br>
                            <strong style="color:#FF9F1C;">${subsidyDB["s019"].title}</strong><br>
                            <span style="font-size:0.9rem; color:#555;">${subsidyDB["s019"].desc}</span>
                        </div>`;
                    resultTitles.push(subsidyDB["s019"].title);
                }
                
                resultHTML += `<p style="font-size:0.8rem; color:#d90429; font-weight:bold; margin-top:10px;">※申請期限・予算上限があるため、詳細は各担当窓口にお問い合わせください。<br>LiveHUBしものせき TEL:0120-540-201 (火~土 10時~17時)</p>`;
                
                sendDataToGAS(userOrigin, chatHistory.join(" ＞ "), resultTitles.join("、 "));

                showBotMessage(resultHTML);
                showOptions([{ label: "最初からやり直す", next: "start" }]);
                return;
            }

            if (nodeKey === "result_livehub") {
                sendDataToGAS(userOrigin, chatHistory.join(" ＞ "), "該当なし（LiveHUB案内）");

                showBotMessage("恐れ入りますが、該当する補助金が見つかりませんでした。<br>詳細なご相談は「LiveHUBしものせき」まで直接お問い合わせください。<br><br>【お問い合わせ先】<br>TEL: 0120-540-201<br>営業時間: 火〜土 10時〜17時");
                showOptions([{ label: "最初からやり直す", next: "start" }]);
                return;
            }

            const node = scenario[nodeKey];
            if (!node) return;
            showBotMessage(node.text);
            showOptions(node.options);
        }

        // ▼【重要】プログラムを起動する合図（これが消えると真っ白になります！）
        playScenario('start');
    </script>
