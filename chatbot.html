    <style>
        /* ＝＝＝ チャットボット専用のデザイン ＝＝＝ */
        :root {
            --bot-bg: #F7FBFC;
            --bot-main: #00B4D8;
            --bot-accent: #FF9F1C;
            --text-color: #333333;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Zen Maru Gothic', sans-serif;
            background-color: var(--bot-bg);
            color: var(--text-color);
        }

        /* チャットエリア全体 */
        #chat-area {
            padding: 20px;
            padding-bottom: 100px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            height: 100vh;
            box-sizing: border-box;
        }

        /* メッセージの行（アイコン＋吹き出し） */
        .message-row {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ボット側のスタイル（左寄せ） */
        .message-row.bot {
            justify-content: flex-start;
        }
        .bot-icon {
            width: 45px;
            height: 45px;
            background-color: #fff;
            border-radius: 50%;
            border: 2px solid var(--bot-main);
            padding: 3px;
            object-fit: contain;
        }
        .bot .bubble {
            background-color: #fff;
            border: 2px solid var(--bot-main);
            color: var(--text-color);
            border-top-left-radius: 4px;
        }

        /* ユーザー側のスタイル（右寄せ） */
        .message-row.user {
            justify-content: flex-end;
        }
        .user .bubble {
            background-color: var(--bot-main);
            color: #fff;
            border-top-right-radius: 4px;
        }

        /* 吹き出しの共通スタイル */
        .bubble {
            max-width: 75%;
            padding: 12px 18px;
            border-radius: 20px;
            font-size: 0.95rem;
            line-height: 1.6;
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        /* 選択肢ボタンのエリア */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-left: 57px;
            margin-top: -10px;
            animation: fadeIn 0.4s ease;
            animation-fill-mode: both;
            animation-delay: 0.3s;
        }

        /* 選択肢ボタン */
        .option-btn {
            background-color: #fff;
            border: 2px solid var(--bot-accent);
            color: var(--bot-accent);
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: 900;
            font-family: inherit;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(255, 159, 28, 0.1);
            max-width: 85%;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .option-btn:hover {
            background-color: var(--bot-accent);
            color: #fff;
            transform: translateX(5px);
        }
    </style>
</head>

        const chatArea = document.getElementById('chat-area');

        function showBotMessage(message) {
            const row = document.createElement('div');
            row.className = 'message-row bot';

            scrollToBottom();
        }

        function showUserMessage(message) {
            const row = document.createElement('div');
            row.className = 'message-row user';
            row.innerHTML = `<div class="bubble">${message}</div>`;
            chatArea.appendChild(row);
            scrollToBottom();
        }

        function showOptions(options) {
            if (!options || options.length === 0) return;
            const container = document.createElement('div');
            container.className = 'options-container';

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span class="material-symbols-outlined" style="font-size: 1.1rem;">chevron_right</span> ${opt.label}`;
                
                btn.onclick = () => {
                    container.remove();
                    showUserMessage(opt.label);
                    setTimeout(() => { playScenario(opt.next); }, 600);
                };
                container.appendChild(btn);
            });
            chatArea.appendChild(container);
            scrollToBottom();
        }

       // 🎬 シナリオを再生する関数（結果の生成）

            if (nodeKey.startsWith("result_") && nodeKey !== "result_livehub") {
                const ids = nodeKey.replace("result_", "").split("_");
                
                // 🎉を削除し、Google Fontsのアイコン（celebration）に変更しました

                    if(subsidyDB[id]) {
                        resultHTML += `
                            <div style="background:#fff; border:2px solid var(--bot-main); padding:15px; border-radius:10px; margin-bottom:10px; text-align:left; line-height:1.4;">

                            </div>`;

                });

                // 【特記事項の追加】住宅取得(s016)や空き家改修(s006)が含まれる場合、s019の案内を自動追加
                if (ids.includes("s016") || ids.includes("s006")) {
                    resultHTML += `
                            <div style="background:#FFF3E0; border:2px dashed var(--bot-accent); padding:15px; border-radius:10px; margin-bottom:10px; text-align:left; line-height:1.4;">
                                <span style="font-size:0.8rem; font-weight:bold; color:var(--bot-accent);">※三世代同居・近居を予定している方はこちらも対象です！</span><br>
                                <strong style="color:var(--bot-accent); font-size:1rem;">${subsidyDB["s019"].title}</strong><br>
                                <span style="font-size:0.9rem; color:#555;">${subsidyDB["s019"].desc}</span>
                            </div>`;
                }
                
                resultHTML += `<p style="font-size:0.8rem; color:#d90429; margin-top:15px; font-weight:bold; line-height:1.5;">※補助金には申請期限・予算上限があります。<br>詳細・最終確認は必ず各担当窓口（LiveHUBしものせき TEL:0120-540-201 火~土 10時~17時）にお問い合わせください。</p>`;
                
                showBotMessage(resultHTML);
                showOptions([{ label: "最初からやり直す", next: "start" }]);
                return;
            }

            const nodeData = scenario[nodeKey];
            if (!nodeData) return;

            showBotMessage(nodeData.text);
            showOptions(nodeData.options);
        }

       // 常に一番下までチャット枠を自動スクロールする処理
        function scrollToBottom() {
            const chatArea = document.getElementById('chat-area');
            chatArea.scrollTo({
                top: chatArea.scrollHeight,
                behavior: 'smooth'
            });
        }

        setTimeout(() => { playScenario("start"); }, 500);
    </script>
</body>
