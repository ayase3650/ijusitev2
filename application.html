<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>各種申請 | SHIMONOSEKI LIFE</title>
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

    <link rel="stylesheet" href="style.css">

    <style>
        /* ＝＝＝ 白い大きな角丸の枠組み ＝＝＝ */
        .white-board {
            background-color: var(--fugu-belly); /* 真っ白 */
            border-radius: 50px;
            padding: 60px 40px;
            margin: 40px auto 100px auto;
            box-shadow: 0 15px 40px rgba(0, 180, 216, 0.1);
            max-width: 1100px;
        }

        /* ＝＝＝ 各種申請ページ専用のデザイン ＝＝＝ */
        .page-header {
            text-align: center;
            margin-bottom: 50px;
        }
        .page-header h2 {
            font-size: 2.2rem;
            color: var(--fugu-blue);
            font-weight: 900;
            margin-bottom: 15px;
        }
        .page-header p {
            font-weight: 700;
            color: #555;
            line-height: 1.6;
        }

        /* スマホ向けの微調整 */
        @media (max-width: 768px) {
            .white-board { padding: 40px 20px; border-radius: 30px; }
        }
    </style>
</head>
<body>

    <div class="ocean-bg">
        <div class="bubble"></div><div class="bubble"></div>
        <div class="bubble"></div><div class="bubble"></div>
        <div class="bubble"></div><div class="bubble"></div>
    </div>

    <script src="header.js"></script>

    <div class="container">
        <div class="white-board">
            <div class="page-header">
                <h2>各種申請・手続き</h2>
            </div>

            <!-- 工事中用のプレースホルダー -->
            <div class="video-placeholder" style="aspect-ratio: auto; padding: 80px 20px;">
                
                <!-- 工事マークのアイコン -->
                <span class="material-symbols-outlined" style="font-size: 5rem; color: #FF9F1C; margin-bottom: 20px;">
                    construction
                </span>
                
                <h2 class="placeholder-title" style="font-size: 1.5rem; margin-bottom: 15px;">
                    現在準備中です
                </h2>
                
                <p class="placeholder-sub" style="font-size: 1rem; line-height: 1.6;">
                    受付サーバーの準備を行っているため、一時的にフォームを停止しております。<br>
                    ご不便をおかけいたしますが、公開までもうしばらくお待ちください。
                </p>
                
                <!-- トップへ戻るボタン -->
                <a href="index.html" class="btn-more" style="margin-top: 30px;">
                    トップページへ戻る
                </a>
            </div>
        </div>
    </div>

</body>
</html>
